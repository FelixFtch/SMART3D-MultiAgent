/laser_scan_matcher:
  ros__parameters:
    publish_odom: /odom
    publish_tf: true
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    laser_frame: laser_link
    kf_dist_linear: 0.05
    kf_dist_angular: 0.0872665
    max_linear_correction: 0.20
    max_angular_correction_deg: 20.0
    max_correspondence_dist: 0.20
    max_iterations: 10
    sigma: 0.01
    restart: 0
    use_point_to_line_distance: 1
    do_compute_covariance: 1
